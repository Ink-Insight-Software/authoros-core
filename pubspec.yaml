name: authoros_core
description: >-
  The shared AuthorOS core: the record envelope, record and connection type
  registries, built-in record types, the story structure and stable IDs. Pure
  Dart. AuthorOS Write and the standalone applications depend on it; none of
  them copies it.
publish_to: none
version: 0.14.0

environment:
  sdk: ">=3.6.0 <4.0.0"


dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
